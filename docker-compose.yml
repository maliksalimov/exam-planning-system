services:
  postgres:
    image: postgres:16
    container_name: exam-planning-postgres
    environment:
      POSTGRES_DB: exam_planning_system
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_password
    ports:
      - "5433:5432"
    volumes:
      - exam_postgres_data:/var/lib/postgresql/data

volumes:
  exam_postgres_data:
